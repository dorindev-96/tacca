name: tacca
description: "Gym workout plans: manual editor, guided session with timers, history and AI import of paper plans (BYOK)."
repository: https://github.com/dorex96/tacca
issue_tracker: https://github.com/dorex96/tacca/issues
publish_to: 'none'
version: 0.1.0+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  wakelock_plus: ^1.4.0
  audioplayers: ^6.7.1
  vibration: ^3.1.8
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.2.2
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.5
  flutter_native_ocr: ^0.1.0
  # Apre i termini e condizioni nel browser di sistema. L'app non
  # incorpora nessuna WebView: vedi lib/services/links/link_opener.dart.
  url_launcher: ^6.3.2
  # Foglio di condivisione di sistema: serve solo a consegnare a un'altra app
  # (WhatsApp, mail, "Salva nelle foto") il PNG di una scheda esportata. Il
  # disegno dell'immagine è nostro, vedi services/images/widget_image_renderer.dart.
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.15.1
  objectbox_generator: ^5.3.2
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  change_app_package_name: ^1.4.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Segnali acustici dei timer della sessione (§7).
    - assets/audio/
    # Catalogo dei provider e dei modelli selezionabili (Impostazioni AI, RF-08).
    - assets/ai/
  fonts:
    # Lato è il carattere dell'interfaccia (vedi lib/core/design/app_typography.dart).
    # Google Fonts pubblica solo 400/700/900: i pesi 500 e 800 del design non
    # esistono, quindi i token tipografici usano direttamente questi tre.
    # Licenza SIL OFL 1.1 in assets/fonts/OFL.txt.
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
